<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Green Perfume Boutique - 3D Store</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            background: linear-gradient(135deg, #1a3a2e 0%, #2d5a4a 100%);
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #info-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(26, 58, 46, 0.9);
            color: #a8e6cf;
            padding: 20px 25px;
            border-radius: 12px;
            font-size: 14px;
            max-width: 300px;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(168, 230, 207, 0.3);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
        }

        #info-panel h1 {
            font-size: 22px;
            margin-bottom: 12px;
            color: #7bed9f;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        #info-panel p {
            margin: 8px 0;
            line-height: 1.6;
            color: #c8f5e0;
        }

        #info-panel .controls {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid rgba(168, 230, 207, 0.2);
        }

        #info-panel .control-item {
            display: flex;
            align-items: center;
            margin: 6px 0;
        }

        #info-panel .control-icon {
            width: 24px;
            height: 24px;
            background: rgba(123, 237, 159, 0.2);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 12px;
        }

        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #7bed9f;
            font-size: 24px;
            font-weight: 600;
            text-align: center;
            z-index: 1000;
        }

        #loading .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(123, 237, 159, 0.3);
            border-top: 4px solid #7bed9f;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div id="loading">
        <div class="spinner"></div>
        <div>Loading Perfume Boutique...</div>
    </div>
    
    <div id="canvas-container"></div>
    
    <div id="info-panel">
        <h1>🌿 Green Perfume Boutique</h1>
        <p>Explore our luxurious collection of nature-inspired fragrances in this immersive 3D experience.</p>
        <div class="controls">
            <div class="control-item">
                <div class="control-icon">🖱️</div>
                <span>Drag to rotate view</span>
            </div>
            <div class="control-item">
                <div class="control-icon">🔍</div>
                <span>Scroll to zoom in/out</span>
            </div>
            <div class="control-item">
                <div class="control-icon">👆</div>
                <span>Right-click drag to pan</span>
            </div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x1a3a2e);
        scene.fog = new THREE.Fog(0x1a3a2e, 10, 50);

        // Camera setup
        const camera = new THREE.PerspectiveCamera(
            60,
            window.innerWidth / window.innerHeight,
            0.1,
            1000
        );
        camera.position.set(0, 5, 15);

        // Renderer setup
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 5;
        controls.maxDistance = 30;
        controls.maxPolarAngle = Math.PI / 2;
        controls.target.set(0, 2, 0);

        // Lighting
        const ambientLight = new THREE.AmbientLight(0xa8e6cf, 0.4);
        scene.add(ambientLight);

        const mainLight = new THREE.DirectionalLight(0xffffff, 1.2);
        mainLight.position.set(5, 10, 5);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 2048;
        mainLight.shadow.mapSize.height = 2048;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 50;
        mainLight.shadow.camera.left = -15;
        mainLight.shadow.camera.right = 15;
        mainLight.shadow.camera.top = 15;
        mainLight.shadow.camera.bottom = -15;
        scene.add(mainLight);

        // Green accent lights
        const greenLight1 = new THREE.PointLight(0x7bed9f, 1.5, 20);
        greenLight1.position.set(-5, 4, -5);
        scene.add(greenLight1);

        const greenLight2 = new THREE.PointLight(0x56c596, 1.5, 20);
        greenLight2.position.set(5, 4, -5);
        scene.add(greenLight2);

        // Floor
        const floorGeometry = new THREE.PlaneGeometry(30, 30);
        const floorMaterial = new THREE.MeshStandardMaterial({
            color: 0x2d5a4a,
            roughness: 0.3,
            metalness: 0.6,
        });
        const floor = new THREE.Mesh(floorGeometry, floorMaterial);
        floor.rotation.x = -Math.PI / 2;
        floor.receiveShadow = true;
        scene.add(floor);

        // Back wall
        const wallGeometry = new THREE.PlaneGeometry(30, 12);
        const wallMaterial = new THREE.MeshStandardMaterial({
            color: 0x1e4d3c,
            roughness: 0.8,
        });
        const backWall = new THREE.Mesh(wallGeometry, wallMaterial);
        backWall.position.set(0, 6, -10);
        backWall.receiveShadow = true;
        scene.add(backWall);

        // Side walls
        const leftWall = new THREE.Mesh(wallGeometry, wallMaterial);
        leftWall.position.set(-15, 6, 0);
        leftWall.rotation.y = Math.PI / 2;
        leftWall.receiveShadow = true;
        scene.add(leftWall);

        const rightWall = new THREE.Mesh(wallGeometry, wallMaterial);
        rightWall.position.set(15, 6, 0);
        rightWall.rotation.y = -Math.PI / 2;
        rightWall.receiveShadow = true;
        scene.add(rightWall);

        // Create perfume bottle function
        function createPerfumeBottle(x, y, z, color, scale = 1) {
            const group = new THREE.Group();

            // Bottle body (glass)
            const bodyGeometry = new THREE.CylinderGeometry(0.4 * scale, 0.5 * scale, 1.5 * scale, 6);
            const bodyMaterial = new THREE.MeshPhysicalMaterial({
                color: color,
                transparent: true,
                opacity: 0.6,
                roughness: 0.1,
                metalness: 0.1,
                transmission: 0.9,
                thickness: 0.5,
            });
            const body = new THREE.Mesh(bodyGeometry, bodyMaterial);
            body.castShadow = true;
            body.receiveShadow = true;
            group.add(body);

            // Bottle cap (metallic)
            const capGeometry = new THREE.CylinderGeometry(0.35 * scale, 0.35 * scale, 0.3 * scale, 6);
            const capMaterial = new THREE.MeshStandardMaterial({
                color: 0xd4af37,
                roughness: 0.2,
                metalness: 0.9,
            });
            const cap = new THREE.Mesh(capGeometry, capMaterial);
            cap.position.y = 0.9 * scale;
            cap.castShadow = true;
            group.add(cap);

            // Perfume liquid inside
            const liquidGeometry = new THREE.CylinderGeometry(0.35 * scale, 0.45 * scale, 1.2 * scale, 6);
            const liquidMaterial = new THREE.MeshStandardMaterial({
                color: color,
                transparent: true,
                opacity: 0.8,
                emissive: color,
                emissiveIntensity: 0.2,
            });
            const liquid = new THREE.Mesh(liquidGeometry, liquidMaterial);
            liquid.position.y = -0.1 * scale;
            group.add(liquid);

            group.position.set(x, y, z);
            
            // Add floating animation
            group.userData.originalY = y;
            group.userData.floatSpeed = 0.5 + Math.random() * 0.5;
            group.userData.floatOffset = Math.random() * Math.PI * 2;

            return group;
        }

        // Create display shelf function
        function createShelf(x, y, z, width, depth) {
            const group = new THREE.Group();

            // Shelf surface
            const shelfGeometry = new THREE.BoxGeometry(width, 0.1, depth);
            const shelfMaterial = new THREE.MeshStandardMaterial({
                color: 0x3d6b5a,
                roughness: 0.6,
                metalness: 0.3,
            });
            const shelf = new THREE.Mesh(shelfGeometry, shelfMaterial);
            shelf.castShadow = true;
            shelf.receiveShadow = true;
            group.add(shelf);

            // Shelf edge (decorative)
            const edgeGeometry = new THREE.BoxGeometry(width, 0.15, 0.1);
            const edgeMaterial = new THREE.MeshStandardMaterial({
                color: 0x7bed9f,
                roughness: 0.4,
                metalness: 0.6,
            });
            const edge = new THREE.Mesh(edgeGeometry, edgeMaterial);
            edge.position.set(0, -0.05, depth / 2);
            group.add(edge);

            group.position.set(x, y, z);
            return group;
        }

        // Create pedestal function
        function createPedestal(x, y, z, height) {
            const group = new THREE.Group();

            // Pedestal base
            const baseGeometry = new THREE.CylinderGeometry(0.8, 1, 0.3, 8);
            const baseMaterial = new THREE.MeshStandardMaterial({
                color: 0x2d5a4a,
                roughness: 0.5,
                metalness: 0.5,
            });
            const base = new THREE.Mesh(baseGeometry, baseMaterial);
            base.castShadow = true;
            base.receiveShadow = true;
            group.add(base);

            // Pedestal column
            const columnGeometry = new THREE.CylinderGeometry(0.6, 0.6, height, 8);
            const columnMaterial = new THREE.MeshStandardMaterial({
                color: 0x3d6b5a,
                roughness: 0.6,
                metalness: 0.4,
            });
            const column = new THREE.Mesh(columnGeometry, columnMaterial);
            column.position.y = height / 2 + 0.15;
            column.castShadow = true;
            column.receiveShadow = true;
            group.add(column);

            // Pedestal top
            const topGeometry = new THREE.CylinderGeometry(0.9, 0.7, 0.2, 8);
            const topMaterial = new THREE.MeshStandardMaterial({
                color: 0x7bed9f,
                roughness: 0.3,
                metalness: 0.7,
            });
            const top = new THREE.Mesh(topGeometry, topMaterial);
            top.position.y = height + 0.25;
            top.castShadow = true;
            group.add(top);

            group.position.set(x, y, z);
            return group;
        }

        // Create decorative plant
        function createPlant(x, y, z) {
            const group = new THREE.Group();

            // Pot
            const potGeometry = new THREE.CylinderGeometry(0.4, 0.3, 0.6, 8);
            const potMaterial = new THREE.MeshStandardMaterial({
                color: 0x4a7c59,
                roughness: 0.8,
            });
            const pot = new THREE.Mesh(potGeometry, potMaterial);
            pot.castShadow = true;
            group.add(pot);

            // Leaves
            const leafMaterial = new THREE.MeshStandardMaterial({
                color: 0x56c596,
                roughness: 0.7,
                side: THREE.DoubleSide,
            });

            for (let i = 0; i < 8; i++) {
                const leafGeometry = new THREE.ConeGeometry(0.2, 0.8, 4);
                const leaf = new THREE.Mesh(leafGeometry, leafMaterial);
                const angle = (i / 8) * Math.PI * 2;
                leaf.position.set(
                    Math.cos(angle) * 0.3,
                    0.5 + Math.random() * 0.5,
                    Math.sin(angle) * 0.3
                );
                leaf.rotation.z = Math.PI / 6;
                leaf.rotation.y = angle;
                leaf.castShadow = true;
                group.add(leaf);
            }

            group.position.set(x, y, z);
            return group;
        }

        // Create main display shelves
        const mainShelf1 = createShelf(0, 2, -8, 8, 2);
        scene.add(mainShelf1);

        const mainShelf2 = createShelf(0, 3.5, -8, 8, 2);
        scene.add(mainShelf2);

        const mainShelf3 = createShelf(0, 5, -8, 8, 2);
        scene.add(mainShelf3);

        // Side shelves
        const leftShelf1 = createShelf(-8, 2, -3, 4, 2);
        scene.add(leftShelf1);

        const leftShelf2 = createShelf(-8, 3.5, -3, 4, 2);
        scene.add(leftShelf2);

        const rightShelf1 = createShelf(8, 2, -3, 4, 2);
        scene.add(rightShelf1);

        const rightShelf2 = createShelf(8, 3.5, -3, 4, 2);
        scene.add(rightShelf2);

        // Create perfume bottles with various green shades
        const perfumeBottles = [];
        const greenColors = [
            0x7bed9f, // Mint green
            0x56c596, // Sea green
            0x3d9970, // Medium green
            0x2ecc71, // Emerald
            0x27ae60, // Nephritis
            0x1abc9c, // Turquoise
            0x16a085, // Green sea
            0x52b788, // Sage green
        ];

        // Main shelf bottles
        for (let i = 0; i < 6; i++) {
            const x = -3 + i * 1.2;
            const bottle = createPerfumeBottle(x, 2.8, -8, greenColors[i % greenColors.length], 1);
            perfumeBottles.push(bottle);
            scene.add(bottle);
        }

        // Second shelf bottles
        for (let i = 0; i < 5; i++) {
            const x = -2.5 + i * 1.2;
            const bottle = createPerfumeBottle(x, 4.3, -8, greenColors[(i + 2) % greenColors.length], 0.9);
            perfumeBottles.push(bottle);
            scene.add(bottle);
        }

        // Third shelf bottles
        for (let i = 0; i < 4; i++) {
            const x = -2 + i * 1.3;
            const bottle = createPerfumeBottle(x, 5.8, -8, greenColors[(i + 4) % greenColors.length], 0.8);
            perfumeBottles.push(bottle);
            scene.add(bottle);
        }

        // Left shelf bottles
        for (let i = 0; i < 3; i++) {
            const x = -8.5 + i * 1.2;
            const bottle = createPerfumeBottle(x, 2.8, -3, greenColors[(i + 1) % greenColors.length], 0.9);
            perfumeBottles.push(bottle);
            scene.add(bottle);
        }

        for (let i = 0; i < 3; i++) {
            const x = -8.5 + i * 1.2;
            const bottle = createPerfumeBottle(x, 4.3, -3, greenColors[(i + 3) % greenColors.length], 0.85);
            perfumeBottles.push(bottle);
            scene.add(bottle);
        }

        // Right shelf bottles
        for (let i = 0; i < 3; i++) {
            const x = 7.5 + i * 1.2;
            const bottle = createPerfumeBottle(x, 2.8, -3, greenColors[(i + 5) % greenColors.length], 0.9);
            perfumeBottles.push(bottle);
            scene.add(bottle);
        }

        for (let i = 0; i < 3; i++) {
            const x = 7.5 + i * 1.2;
            const bottle = createPerfumeBottle(x, 4.3, -3, greenColors[(i + 6) % greenColors.length], 0.85);
            perfumeBottles.push(bottle);
            scene.add(bottle);
        }

        // Create pedestals with featured bottles
        const pedestal1 = createPedestal(-4, 0, 2, 2);
        scene.add(pedestal1);
        const featuredBottle1 = createPerfumeBottle(-4, 3.2, 2, 0x7bed9f, 1.3);
        perfumeBottles.push(featuredBottle1);
        scene.add(featuredBottle1);

        const pedestal2 = createPedestal(4, 0, 2, 2);
        scene.add(pedestal2);
        const featuredBottle2 = createPerfumeBottle(4, 3.2, 2, 0x2ecc71, 1.3);
        perfumeBottles.push(featuredBottle2);
        scene.add(featuredBottle2);

        const pedestal3 = createPedestal(0, 0, 5, 1.5);
        scene.add(pedestal3);
        const featuredBottle3 = createPerfumeBottle(0, 2.7, 5, 0x1abc9c, 1.2);
        perfumeBottles.push(featuredBottle3);
        scene.add(featuredBottle3);

        // Add decorative plants
        const plant1 = createPlant(-10, 0.3, -8);
        scene.add(plant1);

        const plant2 = createPlant(10, 0.3, -8);
        scene.add(plant2);

        const plant3 = createPlant(-10, 0.3, 5);
        scene.add(plant3);

        const plant4 = createPlant(10, 0.3, 5);
        scene.add(plant4);

        // Add spotlights for featured bottles
        function addSpotlight(x, y, z, targetX, targetY, targetZ, color) {
            const spotlight = new THREE.SpotLight(color, 2, 15, Math.PI / 6, 0.5, 1);
            spotlight.position.set(x, y, z);
            spotlight.target.position.set(targetX, targetY, targetZ);
            spotlight.castShadow = true;
            spotlight.shadow.mapSize.width = 1024;
            spotlight.shadow.mapSize.height = 1024;
            scene.add(spotlight);
            scene.add(spotlight.target);
            return spotlight;
        }

        addSpotlight(-4, 8, 4, -4, 3.2, 2, 0x7bed9f);
        addSpotlight(4, 8, 4, 4, 3.2, 2, 0x2ecc71);
        addSpotlight(0, 8, 7, 0, 2.7, 5, 0x1abc9c);

        // Ambient particles
        const particleCount = 100;
        const particlesGeometry = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);

        for (let i = 0; i < particleCount * 3; i += 3) {
            particlePositions[i] = (Math.random() - 0.5) * 30;
            particlePositions[i + 1] = Math.random() * 12;
            particlePositions[i + 2] = (Math.random() - 0.5) * 20 - 5;
        }

        particlesGeometry.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));

        const particlesMaterial = new THREE.PointsMaterial({
            color: 0x7bed9f,
            size: 0.1,
            transparent: true,
            opacity: 0.6,
            blending: THREE.AdditiveBlending,
        });

        const particles = new THREE.Points(particlesGeometry, particlesMaterial);
        scene.add(particles);

        // Hide loading screen
        document.getElementById('loading').classList.add('hidden');

        // Animation loop
        let time = 0;
        function animate() {
            requestAnimationFrame(animate);
            time += 0.01;

            // Animate perfume bottles (floating effect)
            perfumeBottles.forEach((bottle) => {
                const floatY = Math.sin(time * bottle.userData.floatSpeed + bottle.userData.floatOffset) * 0.1;
                bottle.position.y = bottle.userData.originalY + floatY;
                bottle.rotation.y += 0.005;
            });

            // Animate particles
            const positions = particles.geometry.attributes.position.array;
            for (let i = 1; i < positions.length; i += 3) {
                positions[i] += 0.01;
                if (positions[i] > 12) {
                    positions[i] = 0;
                }
            }
            particles.geometry.attributes.position.needsUpdate = true;
            particles.rotation.y += 0.0005;

            // Animate lights
            greenLight1.intensity = 1.5 + Math.sin(time * 0.5) * 0.3;
            greenLight2.intensity = 1.5 + Math.cos(time * 0.5) * 0.3;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // Raycaster for hover effects
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let hoveredBottle = null;

        window.addEventListener('mousemove', (event) => {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(perfumeBottles, true);

            if (hoveredBottle) {
                hoveredBottle.scale.set(1, 1, 1);
                hoveredBottle = null;
            }

            if (intersects.length > 0) {
                hoveredBottle = intersects[0].object.parent;
                hoveredBottle.scale.set(1.1, 1.1, 1.1);
                document.body.style.cursor = 'pointer';
            } else {
                document.body.style.cursor = 'default';
            }
        });
    </script>
</body>
</html>
